<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>샤시설계팀 업무관리 v2</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f6fb;
      font-family: Arial, sans-serif;
      color: #183153;
    }

    .card {
      width: 390px;
      max-width: calc(100% - 32px);
      padding: 36px 28px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 6px 24px #00000012;
      text-align: center;
    }

    h1 {
      font-size: 23px;
      margin: 0 0 12px;
    }

    .subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 30px;
    }

    #googleButton {
      display: flex;
      justify-content: center;
      min-height: 44px;
    }

    .status {
      margin-top: 24px;
      padding: 14px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }

    .status.error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .status.success {
      background: #f0fdf4;
      color: #15803d;
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="card">

    <h1>샤시설계팀 업무관리</h1>

    <div class="subtitle">
      업무관리 시스템 v2
    </div>

    <div id="googleButton"></div>

    <div id="status" class="status">
      Google 로그인 준비 중...
    </div>

    <div class="note">
      등록된 팀원 계정으로 로그인해 주세요.
    </div>

  </main>

  <!--
    브라우저 fetch() 대신 HTML form POST를 사용합니다.
    토큰을 URL에 넣지 않고 POST 본문으로 전달합니다.
  -->
  <form
    id="authForm"
    method="POST"
    action="https://script.google.com/macros/s/AKfycbzLVBB4xzBqK-eG8ZPiJ7DI0Bz8szOs7cCisSu7MHQNMHELWgtyfQPeJKNlJYtZIOfNgA/exec"
    accept-charset="UTF-8"
    style="display:none"
  >
    <input
      type="hidden"
      id="idToken"
      name="id_token"
      autocomplete="off"
    >
  </form>

  <script>
    "use strict";

    const CONFIG = Object.freeze({
      CLIENT_ID:
        "493152029207-4sehpupjit6h7nn0k0pgprd3q3mhfnb1.apps.googleusercontent.com"
    });

    let submitting = false;

    function setStatus(message, type = "") {
      const el = document.getElementById("status");
      el.textContent = message;
      el.className = "status" + (type ? " " + type : "");
    }

    function handleGoogleLogin(response) {
      if (!response || !response.credential) {
        setStatus(
          "Google 로그인 응답을 받지 못했습니다.",
          "error"
        );
        return;
      }

      if (submitting) {
        return;
      }

      submitting = true;

      setStatus(
        "Google 로그인에 성공했습니다. 서버에서 팀원 정보를 확인하고 있습니다.",
        "success"
      );

      const tokenField = document.getElementById("idToken");
      const form = document.getElementById("authForm");

      tokenField.value = response.credential;

      // 브라우저가 Apps Script 인증 결과 화면으로 이동합니다.
      // Google 토큰은 URL에 포함되지 않습니다.
      form.submit();

      // POST 전송 이후 페이지가 이동할 때까지
      // 불필요하게 토큰을 유지하지 않습니다.
      tokenField.value = "";
    }

    function initializeGoogleLogin() {
      if (!window.google ||
          !google.accounts ||
          !google.accounts.id) {
        setStatus(
          "Google 로그인 모듈을 불러오지 못했습니다.",
          "error"
        );
        return;
      }

      google.accounts.id.initialize({
        client_id: CONFIG.CLIENT_ID,
        callback: handleGoogleLogin,
        auto_select: false
      });

      google.accounts.id.renderButton(
        document.getElementById("googleButton"),
        {
          theme: "outline",
          size: "large",
          width: 290,
          text: "signin_with",
          shape: "rectangular"
        }
      );

      setStatus("Google 계정으로 로그인해 주세요.");
    }

    window.addEventListener("load", initializeGoogleLogin);
  </script>
</body>
</html>
