<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>샤시설계팀 업무관리 v2</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f6fb;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 340px;
      padding: 36px 28px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 6px 24px #00000012;
      text-align: center;
    }
    h1 { font-size: 23px; color: #183153; }
    p { color: #64748b; line-height: 1.7; }
    .status {
      margin-top: 24px;
      padding: 14px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1d4ed8;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>샤시설계팀 업무관리</h1>
    <p>업무관리 시스템 v2</p>
    <div class="status">Google 로그인 기능 준비 중</div>
  </main>
</body>
</html>
